<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SolveNow</title>
<style>
  :root { --bg: #f8fafc; --ink: #0f172a; --soft: #64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --ink: #f8fafc; --soft: #94a3b8; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center; padding: 0 16px;
  }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 800; margin: 0 0 .5rem; letter-spacing: -.02em; }
  p  { font-size: 1.125rem; color: var(--soft); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>SolveNow</h1>
  <p>Coming soon.</p>
</main>
</body>
</html>
